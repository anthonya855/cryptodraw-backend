name: Expand prepared CryptoDraw source

on:
  push:
    paths:
      - 'bootstrap.ready'

permissions:
  contents: write

jobs:
  expand:
    if: ${{ hashFiles('.bootstrap/part00') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand prepared source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* > /tmp/cryptodraw.b64
          base64 --decode /tmp/cryptodraw.b64 > /tmp/cryptodraw-src.tgz
          tar -xzf /tmp/cryptodraw-src.tgz -C .
          rm -rf .bootstrap bootstrap.ready
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Expand complete CryptoDraw backend source"
            git push
          fi
