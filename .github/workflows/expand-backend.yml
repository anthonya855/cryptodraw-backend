name: Expand CryptoDraw backend source

on:
  push:
    paths:
      - '.deploy/expand-backend.trigger'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand prepared backend source
        shell: bash
        run: |
          set -euo pipefail
          test -f .deploy/cryptodraw-backend-app-proxy.tgz.b64
          base64 --decode .deploy/cryptodraw-backend-app-proxy.tgz.b64 > /tmp/cryptodraw-backend.tgz
          tar -xzf /tmp/cryptodraw-backend.tgz -C .
          rm -rf .deploy
          rm -f .github/workflows/expand-backend.yml
      - name: Commit direct backend source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand backend-first Shopify App Proxy source"
          git push
