services:
  - type: web
    name: cryptodraw-api
    runtime: node
    plan: free
    buildCommand: cat .bootstrap/part* | base64 --decode > /tmp/cryptodraw-src.tgz && tar -xzf /tmp/cryptodraw-src.tgz -C . && npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cryptodraw-db
          property: connectionString
      - key: PUBLIC_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SESSION_HOURS
        value: "12"
      - key: EVM_NETWORKS_JSON
        sync: false
      - key: TRON_NETWORKS_JSON
        sync: false
      - key: DRAND_BASE_URL
        value: https://api.drand.sh
      - key: DRAND_CHAIN_HASH
        sync: false
      - key: DRAND_PUBLIC_KEY
        sync: false
      - key: SEED_POOL_ID
        value: POOL-2026-0142
      - key: SEED_POOL_PRIZE
        value: 0.42 BTC
      - key: SEED_POOL_PRIZE_USD
        value: $27,300
      - key: SEED_POOL_ENTRY_FEE_USDT
        value: "1.000000"
      - key: SEED_POOL_MAX_ENTRIES
        value: "25000"

databases:
  - name: cryptodraw-db
    plan: free
    databaseName: cryptodraw
    user: cryptodraw
