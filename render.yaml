services:
  - type: web
    name: cryptodraw-api
    runtime: node
    plan: free
    buildCommand: base64 --decode .deploy/cryptodraw-backend-app-proxy.tgz.b64 > /tmp/cryptodraw-src.tgz && tar -xzf /tmp/cryptodraw-src.tgz -C . && npm install
    startCommand: node src/migrate.js && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOW_UNCONFIGURED_STARTUP
        value: "true"
      - key: ALLOW_DIRECT_PUBLIC_API
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: cryptodraw-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_SESSION_HOURS
        value: "12"
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_SHOP_DOMAIN
        value: vpm72x-ic.myshopify.com
      - key: SHOPIFY_PROXY_PATH
        value: /apps/cryptodraw
      - key: SHOPIFY_PROXY_MAX_AGE_SECONDS
        value: "300"
      - key: REOWN_PROJECT_ID
        sync: false
      - key: EVM_NETWORKS_JSON
        sync: false
      - key: TRON_NETWORKS_JSON
        sync: false
      - key: DRAND_BASE_URL
        value: https://api.drand.sh
      - key: DRAND_CHAIN_HASH
        value: 52db9ba70e0cc0f6eaf7803dd07447a1f5477735fd3f661792ba94600c84e971
      - key: DRAND_PUBLIC_KEY
        value: 83cf0f2896adee7eb8b5f01fcad3912212c437e0073e911fb90022d3e760183c8c4b450b6a0a6c3ac6a5776a2d1064510d1fec758c921cc22b0e17e63aaf4bcb5ed66304de9cf809bd274ca73bab4af5a6e9c76a4bc09e76eae8991ef5ece45a
      - key: SEED_POOL_ID
        value: POOL-2026-0142
      - key: SEED_POOL_PRIZE
        value: 0.42 BTC
      - key: SEED_POOL_PRIZE_USD
        value: $27,300
      - key: SEED_POOL_ENTRY_FEE_USDT
        value: "1.000000"
      - key: SEED_POOL_MAX_ENTRIES
        value: "25000"

databases:
  - name: cryptodraw-db
    plan: free
    databaseName: cryptodraw
    user: cryptodraw
